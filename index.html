<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القرآن الكريم - صدقة جارية</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #1e293b;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }

    h1 {
      text-align: center;
      font-size: 1.7rem;
      margin-bottom: 6px;
      color: #f8fafc;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 18px;
    }

    .dua {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 22px;
      color: #e2e8f0;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .dua strong {
      color: #38bdf8;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    select, button {
      width: 100%;
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
    }

    select:focus {
      border-color: #38bdf8;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      border: none;
    }

    #playBtn {
      background: #0ea5e9;
      color: white;
    }

    #playBtn:hover {
      background: #0284c7;
    }

    #stopBtn {
      background: #334155;
      color: #e2e8f0;
    }

    #stopBtn:hover {
      background: #475569;
    }

    .status {
      text-align: center;
      margin-top: 18px;
      padding: 12px;
      background: #0f172a;
      border-radius: 12px;
      font-size: 0.95rem;
      color: #94a3b8;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status.active {
      color: #38bdf8;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>صدقة جارية</h1>
    <div class="subtitle">القرآن الكريم</div>

    <div class="dua">
      لا تنسوا الدعاء لوالدي وأختي<br>
      <strong>بالرحمة والمغفرة</strong>
    </div>

    <label>اختر السورة</label>
    <select id="surah">
      <option value="baqarah">سورة البقرة</option>
      <option value="kahf">سورة الكهف</option>
    </select>

    <label>اختر القارئ</label>
    <select id="qari">
      <option value="ajmi">أحمد العجمي</option>
      <option value="sudais">عبدالرحمن السديس</option>
      <option value="abbad">فارس عباد</option>
    </select>

    <label>عدد مرات التكرار</label>
    <select id="repeat">
      <option value="1">مرة واحدة</option>
      <option value="3">3 مرات</option>
      <option value="5">5 مرات</option>
      <option value="0">تكرار بلا نهاية</option>
    </select>

    <div class="controls">
      <button id="playBtn">▶ تشغيل</button>
      <button id="stopBtn">⏹ إيقاف</button>
    </div>

    <div class="status" id="status">اختر السورة والقارئ ثم اضغط تشغيل</div>

    <div class="footer">بارك الله فيمن نشرها ودعا</div>
  </div>

  <audio id="player"></audio>

  <script>
    const links = {
      baqarah: {
        ajmi: "https://ia600909.us.archive.org/9/items/20261118_20261118_0146/%D8%A7%D8%AD%D8%AD%D9%85%D8%AF%20%D8%A7%D9%84%D8%B9%D8%AC%D9%85%D9%8A%20%D8%A7%D9%84%D8%A8%D9%82%D8%B1%D8%A9.mp3",
        sudais: "https://ia601608.us.archive.org/19/items/20261118_20261118_0205/%D8%A7%D9%84%D8%A8%D9%82%D8%B1%D8%A9%20%D8%A7%D9%84%D8%B3%D8%AF%D9%8A%D8%B3.mp3",
        abbad: "https://ia601804.us.archive.org/35/items/20261118_20261118_0208/%D8%B3%D9%88%D8%B1%D8%A9%20%D8%A7%D9%84%D8%A8%D9%82%D8%B1%D8%A9%20%D9%81%D8%A7%D8%B1%D8%B3%20%D8%B9%D8%A8%D8%A7%D8%AF.mp3"
      },
      kahf: {
        ajmi: "https://ia601009.us.archive.org/16/items/20261118_20261118_0217/%D8%B3%D9%88%D8%B1%D8%A9%20%D8%A7%D9%84%D9%83%D9%87%D9%81%20%D8%A7%D8%AD%D9%85%D8%AF%20%D8%A7%D9%84%D8%B9%D8%AC%D9%85%D9%8A.mp3",
        sudais: "https://ia600900.us.archive.org/16/items/20261118_20261118_0220/%D8%B3%D9%88%D8%B1%D8%A9%20%D8%A7%D9%84%D9%83%D9%87%D9%81%20%D8%A7%D9%84%D8%B3%D8%AF%D9%8A%D8%B3.mp3",
        abbad: "https://ia600405.us.archive.org/28/items/20261118_20261118_0224/%D8%B3%D9%88%D8%B1%D8%A9%20%D8%A7%D9%84%D9%83%D9%87%D9%81%20%D9%81%D8%A7%D8%B1%D8%B3.mp3"
      }
    };

    const surahNames = {
      baqarah: "سورة البقرة",
      kahf: "سورة الكهف"
    };

    const qariNames = {
      ajmi: "أحمد العجمي",
      sudais: "عبدالرحمن السديس",
      abbad: "فارس عباد"
    };

    const player = document.getElementById("player");
    const status = document.getElementById("status");
    const playBtn = document.getElementById("playBtn");
    const stopBtn = document.getElementById("stopBtn");

    let currentRepeat = 1;
    let playedCount = 0;
    let isInfinite = false;

    playBtn.addEventListener("click", () => {
      const surah = document.getElementById("surah").value;
      const qari = document.getElementById("qari").value;
      const repeatValue = parseInt(document.getElementById("repeat").value);

      const link = links[surah][qari];

      if (!link) {
        status.textContent = "عذراً، هذا القارئ غير متوفر لهذه السورة حالياً";
        status.classList.remove("active");
        return;
      }

      player.src = link;
      player.play();

      playedCount = 0;
      isInfinite = repeatValue === 0;
      currentRepeat = isInfinite ? 999999 : repeatValue;

      status.textContent = `يتم تشغيل ${surahNames[surah]} - ${qariNames[qari]}`;
      status.classList.add("active");
    });

    stopBtn.addEventListener("click", () => {
      player.pause();
      player.currentTime = 0;
      status.textContent = "تم الإيقاف";
      status.classList.remove("active");
    });

    player.addEventListener("ended", () => {
      playedCount++;

      if (isInfinite || playedCount < currentRepeat) {
        player.currentTime = 0;
        player.play();
        status.textContent = `تكرار ${playedCount + 1} - ${surahNames[document.getElementById("surah").value]}`;
      } else {
        status.textContent = "انتهى التكرار";
        status.classList.remove("active");
      }
    });
  </script>
</body>
</html>
